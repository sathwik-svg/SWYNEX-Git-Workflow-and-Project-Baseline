# SWYNEX Technologies — Task 3: Repeatable Local & Staging Orchestration
# ==============================================================================

version: '3.8'

services:
  swynex-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: swynex-app:latest
    container_name: swynex-production-container
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
